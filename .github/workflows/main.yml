name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Get dependencies
        run: cd Li && flutter pub get

      - name: Build APK Release
        run: cd Li && flutter build apk --release --target=lib/main.dart

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: Li/build/app/outputs/flutter-apk/app-release.apk
          
